[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pharmasupply_coldchain_thermal_integrity_analytics"
version = "1.0.0"
description = "Biologics cold chain integrity, mean kinetic temperature (MKT) modeling, and carrier SLA compliance."
readme = "README.md"
authors = [
    { name = "Abdussatar", email = "satarabdus692@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Information Analysis"
]
